[workspace]
members = ["core", "notary", "daemon"]
resolver = "2"

[workspace.package]
version      = "25.0.0"
edition      = "2021"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/toorik2/ticker.cash"

[workspace.dependencies]
# crypto — k256 carries both secp256k1 arithmetic (BCH Schnorr) and hashing deps
k256             = { version = "0.13", default-features = false, features = ["std", "arithmetic", "expose-field"] }
sha2             = { version = "0.10", default-features = false, features = ["std"] }
ripemd           = { version = "0.1",  default-features = false }
hmac             = { version = "0.12", default-features = false }
zeroize          = { version = "1", default-features = false }
# TLS for Electrum
rustls           = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = "1"
webpki-roots     = "0.26"
# encoding
serde            = { version = "1", features = ["derive"] }
serde_json       = { version = "1", default-features = false, features = ["std", "arbitrary_precision"] }
hex              = { version = "0.4", default-features = false, features = ["std"] }
# CLI + errors
pico-args        = "0.5"
thiserror        = "2"
libc             = "0.2"
# async runtime (notary + prover; tlsn is tokio-based)
tokio            = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util       = { version = "0.7", features = ["compat"] }
futures          = "0.3"
hyper            = { version = "1.1", features = ["client", "server", "http1"] }
hyper-util       = { version = "0.1", features = ["full"] }
http-body-util   = "0.1"
anyhow           = "1"
# TLSNotary — pinned release tag; not on crates.io
tlsn             = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }

ticker-core      = { path = "core" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 4
panic         = "unwind"
strip         = "symbols"
debug         = false
