name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: cargo test (v25 workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node/target
          key: ${{ runner.os }}-cargo-v25-${{ hashFiles('node/Cargo.lock') }}
      - name: build
        run: cargo build --workspace --release
      - name: test
        run: cargo test --workspace --release

  covenants:
    name: cashc artifacts + VM suite (BCH_2026_05)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: compiled bodies match the committed hex (the Rust crate embeds them)
        run: |
          npx cashc Oracle.cash --hex | diff - artifacts/Oracle.body.hex
          npx cashc Ticker.cash --hex | diff - artifacts/Ticker.body.hex
          npx cashc PriceGated.cash --hex | diff - artifacts/PriceGated.body.hex
      - name: VM suite
        run: npm test
